<header class="site-header" [class.is-scrolled]="scrolled" [class.is-open]="menuOpen">
  <div class="site-header__inner">
    <a routerLink="/" class="brand" (click)="closeMenu()" aria-label="Employee 360 home">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="28" height="28" fill="none">
          <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="2"/>
          <circle cx="16" cy="16" r="6" fill="currentColor"/>
          <path d="M16 2v4M16 26v4M2 16h4M26 16h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand__text">
        <span class="brand__name">{{ brandName }}</span>
        <span class="brand__tag">People portal</span>
      </span>
    </a>

    <button
      type="button"
      class="menu-toggle"
      [attr.aria-expanded]="menuOpen"
      aria-controls="public-nav"
      aria-label="Toggle navigation"
      (click)="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div id="public-nav" class="site-header__panel" [class.is-open]="menuOpen">
      <nav class="nav" aria-label="Primary">
        <a
          *ngFor="let link of links"
          [routerLink]="link.path"
          [fragment]="link.fragment"
          (click)="closeMenu()">
          {{ link.label }}
        </a>
      </nav>

      <div class="site-header__cta">
        <a routerLink="/login" class="btn btn--ghost" (click)="closeMenu()">Sign in</a>
        <a routerLink="/login" class="btn btn--solid" (click)="closeMenu()">Get started</a>
      </div>
    </div>
  </div>
</header>
